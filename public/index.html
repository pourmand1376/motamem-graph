<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>گراف متمم — نقشه پیوند نوشته‌ها</title>
  <style>
    :root { --panel: rgba(255,255,255,.9); --ink:#222; --muted:#667; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: Vazirmatn, Tahoma, "IRANSans", sans-serif; background: #fafafc; color: var(--ink); }
    #graph { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 14px; right: 14px; z-index: 5;
      background: var(--panel); backdrop-filter: blur(6px);
      border: 1px solid #e3e3ea; border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06); width: min(300px, 78vw);
    }
    #panel h1 { font-size: 15px; margin: 0 0 8px; }
    #search { width: 100%; padding: 8px 10px; border: 1px solid #d7d7e0; border-radius: 8px;
      font: inherit; outline: none; }
    #search:focus { border-color: #9aa8ff; }
    #status { margin-top: 8px; font-size: 12px; color: var(--muted); }
    #hint { margin-top: 6px; font-size: 11px; color: #99a; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="panel">
    <h1>نقشه نوشته‌های متمم</h1>
    <input id="search" list="nodes" placeholder="جستجوی عنوان نوشته…" autocomplete="off" />
    <datalist id="nodes"></datalist>
    <div id="status">در حال بارگذاری…</div>
    <div id="hint">روی گره‌ها حرکت کنید تا هم‌سایه‌ها روشن شوند · کلیک = رفتن به نوشته</div>
  </div>
  <script src="./app.js"></script>
</body>
</html>

name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build viewer bundle
        run: npm run viewer:build
      - name: Pull graph.json from the latest data release
        run: |
          # Prefer the GitHub "latest" release; fall back to newest data-* tag.
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern graph.json --dir public --clobber; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("data-"))][0]')
            if [ -z "$TAG" ]; then
              echo "No data-* release found" >&2
              exit 1
            fi
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern graph.json --dir public --clobber
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

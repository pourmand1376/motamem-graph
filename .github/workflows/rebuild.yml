name: Rebuild graph

# Manual trigger: re-enumerate Wayback snapshots, fetch archived pages,
# rebuild the graph, create a new dated data release, and redeploy GitHub Pages.
# Each run fetches from Wayback fresh — no HTML cache is persisted between runs.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Enumerate posts from Wayback CDX
        run: npm run enumerate

      - name: Fetch archived HTML
        run: npm run fetch

      - name: Parse editorial graph
        run: npm run parse

      - name: Bake ForceAtlas2 layout
        run: npm run layout

      - name: Build viewer bundle
        run: npm run viewer:build

      - name: Create new data release
        id: release
        run: |
          TAG="data-$(date -u +%Y%m%d-%H%M%S)"
          NOTES="Rebuilt from Wayback on $(date -u -Iseconds)."
          gh release create "$TAG" \
            public/graph.json \
            data/graph-raw.json \
            data/urls.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Graph data ($TAG)" \
            --notes "$NOTES" \
            --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
